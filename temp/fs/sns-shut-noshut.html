<!-- SNS SHUT / NO SHUT -->
<article id="sns-shut-noshut">
    <div class="konverter-container">
        <div class="container">
            <div class="content">
                <div class="input-section">
                    <textarea id="snsInputData" class="input-textarea" placeholder="Paste data from Konverter OLT here...&#10;&#10;Example:&#10;> BA-TAB-04-LT1-BTRTI&#10;GTGH 1 PON 1,2,3"></textarea>
                    
                    <div class="button-group-sns">
                        <button id="snsC320Disable" class="sns-btn sns-c320" style="background-color: rgb(200, 76, 76);">
                            <i class="fas fa-microchip"></i> 320 DISABLE
                        </button>
                        <button id="snsC320Enable" class="sns-btn sns-c320" style="background-color: green;">
                            <i class="fas fa-microchip"></i> 320 ENABLE
                        </button>
                        <button id="snsC620Disable" class="sns-btn sns-c620" style="background-color: rgb(200, 76, 76);">
                            <i class="fas fa-microchip"></i> 620 DISABLE
                        </button>
                        <button id="snsC620Enable" class="sns-btn sns-c620" style="background-color: green;">
                            <i class="fas fa-microchip"></i> 620 ENABLE
                        </button>
                        <button id="snsHwDisable" class="sns-btn sns-hw" style="background-color: rgb(200, 76, 76);">
                            <i class="fas fa-microchip"></i> HW DISABLE
                        </button>
                        <button id="snsHwEnable" class="sns-btn sns-hw" style="background-color: green;">
                            <i class="fas fa-microchip"></i> HW ENABLE
                        </button>
                    </div>

                    <div class="button-group-sns-actions">
                        <button id="snsCopyBtn" class="sns-action-btn">
                            <i class="fas fa-copy"></i> Copy Command
                        </button>
                    </div>
                </div>
                
                <div class="output-section">
                    <textarea id="snsOutputData" class="output-textarea" readonly placeholder="Generated commands will appear here..."></textarea>
                </div>
            </div>
        </div>
    </div>
</article>
